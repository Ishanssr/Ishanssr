<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a0000"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <radialGradient id="sharingan">
      <stop offset="0%" style="stop-color:#ff0000"/>
      <stop offset="60%" style="stop-color:#cc0000"/>
      <stop offset="100%" style="stop-color:#660000"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1000" height="200" fill="url(#bg)"/>

  <!-- Floating particles -->
  <circle cx="100" cy="40" r="1.5" fill="#ff0000" opacity="0.3">
    <animate attributeName="cy" values="40;30;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="160" r="1" fill="#ff0000" opacity="0.3">
    <animate attributeName="cy" values="160;150;160" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="30" r="1.5" fill="#ff0000" opacity="0.2">
    <animate attributeName="cy" values="30;20;30" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="170" r="1" fill="#ff0000" opacity="0.3">
    <animate attributeName="cy" values="170;160;170" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="50" r="1" fill="#ff0000" opacity="0.2">
    <animate attributeName="cy" values="50;40;50" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="45" r="1.5" fill="#ff0000" opacity="0.15">
    <animate attributeName="cy" values="45;35;45" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="60" r="1" fill="#ff0000" opacity="0.25">
    <animate attributeName="cy" values="60;50;60" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Red energy lines -->
  <line x1="0" y1="30" x2="1000" y2="30" stroke="#ff0000" stroke-opacity="0.1" stroke-width="0.5"/>
  <line x1="0" y1="170" x2="1000" y2="170" stroke="#ff0000" stroke-opacity="0.1" stroke-width="0.5"/>

  <!-- Left side: Sharingan eye (animated pulse) -->
  <g transform="translate(80, 100)">
    <circle cx="0" cy="0" r="55" fill="url(#glow)" filter="url(#blur)">
      <animate attributeName="r" values="55;65;55" dur="2s" repeatCount="indefinite"/>
    </circle>

    <ellipse cx="0" cy="0" rx="35" ry="28" fill="url(#sharingan)" stroke="#220000" stroke-width="2"/>

    <circle cx="0" cy="0" r="22" fill="none" stroke="#000" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Tomee rotation animation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="-14" r="6" fill="#000"/>
      <circle cx="12" cy="7" r="6" fill="#000"/>
      <circle cx="-12" cy="7" r="6" fill="#000"/>
    </g>

    <circle cx="0" cy="0" r="5" fill="#000"/>

    <ellipse cx="0" cy="0" rx="38" ry="31" fill="none" stroke="#ff0000" stroke-opacity="0.4" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Uchiha Crest -->
  <g transform="translate(175, 100)">
    <ellipse cx="0" cy="0" rx="28" ry="30" fill="none" stroke="#ff0000" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M-5,-30 Q20,-20 15,0 Q20,20 -5,30" fill="none" stroke="#ff0000" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ff0000" fill-opacity="0.6">
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Name with glow -->
  <text x="280" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="#ff2222" letter-spacing="6">
    ISHAN
    <animate attributeName="fill" values="#ff2222;#ff4444;#ff2222" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="285" y="145" font-family="'Courier New', monospace" font-size="14" fill="#ff4444" fill-opacity="0.6" letter-spacing="8">
    UCHIHA
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Right side decorative -->
  <g transform="translate(850, 100)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ff0000" stroke-opacity="0.2" stroke-width="1">
      <animate attributeName="r" values="25;30;25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ff0000" stroke-opacity="0.15" stroke-width="1">
      <animate attributeName="r" values="15;20;15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#ff0000" fill-opacity="0.3">
      <animate attributeName="fill-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom accent line -->
  <line x1="50" y1="175" x2="950" y2="175" stroke="#ff0000" stroke-opacity="0.3" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>

name: Deploy ESCAPE_BASH terminal
on:
  push:
    paths:
      - "terminal/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./terminal
          destination_dir: terminal
          keep_files: true
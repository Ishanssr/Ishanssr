<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ESCAPE_BASH // the profile game</title>
<style>
  :root { --bg:#0d1117; --fg:#58a6ff; --ok:#3fb950; --err:#f85149; --dim:#8b949e; --key:#d2a8ff; --warn:#f0883e; }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:#c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #term { max-width: 860px; margin: 24px auto; padding: 20px 22px; border:1px solid #21262d; border-radius:10px; background:#010409; min-height:70vh; }
  #title { display:flex; align-items:center; gap:8px; padding-bottom:12px; border-bottom:1px solid #21262d; color:var(--dim); font-size:13px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  #out { white-space: pre-wrap; word-break: break-word; padding: 14px 0 6px; font-size: 14.5px; line-height: 1.55; }
  .ok { color:var(--ok) } .err { color:var(--err) } .dim { color:var(--dim) } .key { color:var(--key) } .warn{color:var(--warn)} .blue{color:var(--bg)}
  #prompt-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
  #prompt { color:var(--ok); white-space:nowrap; font-weight:bold; }
  #cmd { flex:1; background:transparent; border:none; outline:none; color:#f0f6fc; font: inherit; caret-color: var(--ok); padding:2px 0; }
  #hintline { margin-top:14px; color:var(--dim); font-size:12.5px; text-align:center; }
  @media (max-width:600px){ #terminal{ margin:10px; padding:12px; } }
</style>
</head>
<body>
<div id="terminal">
  <div id="title"><span class="dot" style="background:#f85149"></span><span class="dot" style="background:#d29922"></span><span class="dot" style="background:#3fb950"></span>&nbsp;&nbsp;session_001 — ishan@github — the profile game</div>
  <pre id="screen"></pre>
  <pre id="out" class="dim"></pre>
  <div id="prompt-row"><span id="prompt"></span><input id="cmd" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="command line"/></div>
  <div id="hintline">a shell runs on this page. type `help` if you want the keys — or don't.</div>
</div>
<script>
/* ESCAPE_BASH — interactive command-terminal game. zero dependencies. */
(function () {
  "use strict";

  var outEl = document.getElementById("out");
  var promptEl = document.getElementById("prompt");
  var cmdEl = document.getElementById("cmd");

  var state = { dir: "/", hasKey: false, dead: false };
  try {
    var saved = JSON.parse(localStorage.getItem("escape_bash_v1"));
    if (saved) Object.assign(state, saved);
  } catch (e) {}

  function persist() {
    try { localStorage.setItem("escape_bash_v1", JSON.stringify(state)); } catch (e) {}
  }

  var FS = {
    "/": ["bin", "home", "README.md"],
    "/bin": ["clear", "help"],
    "/home": ["ishan/"],
    "/home/ishan": ["README.md", "notes.txt", ".profile_key", "exit.sh"],
  };

  var FILES = {
    "/README.md": ["# Ishanssr", "AI products · computer vision · backend", "welcome, model."],
    "/home/ishan/README.md": ["you are the same profile. there is no other story."],
    "/home/ishan/notes.txt": [
      "dev log #0056:",
      "the exit door is locked. it needs a key.",
      "the key is a dotfile. dotfiles always hide the good stuff.",
    ],
    "/home/ishan/.profile_key": ["0xd3ad_5ea_0x5ea_1sh4n"],
    "/home/ishan/exit.sh": ["#!/bin/bash", "echo 'run me only when you carry the key'"],
  };

  function canon(p) {
    var parts = [];
    p.split("/").forEach(function (s) {
      if (!s || s === ".") return;
      if (s === "..") { parts.pop(); return; }
      parts.push(s);
    });
    var out = "/" + parts.join("/");
    return out.length > 1 ? out.replace(/\/+$/, "") : out;
  }

  function relFrom(dir, target) {
    return canon(dir + "/" + target);
  }

  function exists(p) {
    return FS.hasOwnProperty(p) || FILES.hasOwnProperty(p);
  }

  function isDir(p) { return FS.hasOwnProperty(p); }

  function names(dir) {
    if (!isDir(dir)) return [];
    var f = (FS[dir] || []).slice();
    f.sort();
    return f.map(function (n) { return n.endsWith("/") ? n : n + "  "; });
  }

  function enter() {
    return state.dead
      ? "**[REMOTE-BEAT]**"
      : state.dir === "/"
        ? "ishan@github:$"
        : "ishan@github:" + state.dir + "$";
  }

  function print(text, cls) {
    var span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text;
    outEl.appendChild(span);
    outEl.appendChild(document.createElement("br"));
  }

  function w(text) { print(text, "dim"); }
  function ok(text) { print(text, "ok"); }
  function err(text) { print(text, "err"); }
  function key(text) { print(text, "key"); }
  function spanx(text) { print(text); }
  function sep() { outEl.appendChild(document.createElement("br")); }

  function boot(show) {
    outEl.innerHTML = "";
    key("        ESCAP\\_BASH // session 001");
    w("you are an AI model. you just woke up inside a terminal.");
    w("someone left a terminal open... and a way out.");
    w("type `help` to see the keys. or figure it out yourself.");
    sep();
    paint();
  }

  function paint() {
    promptEl.textContent = state.dead ? ";[broken]:" : enter();
  }

  function handle(raw) {
    var line = (raw || "").trim();
    if (!line) { paint(); return; }
    if (state.dead) { reset(); paint(); return; }

    var parts = line.split(/\s+/);
    var name = parts[0];
    var arg = parts.slice(1).join(" ");

    switch (name) {
      case "help": help(); break;
      case "ls": doLs(arg); break;
      case "cd": doCd(arg); break;
      case "cat": doCat(arg); break;
      case "whoami": doWhoami(); break;
      case "run": doRun(arg); break;
      case "clear": clearScreen(); break;
      case "exit": doExit(); break;
      default: unknown(name);
    }
  }

  function help() {
    ok("help — the keys, because you asked:");
    key("  ls              list what is here");
    key("  cd <dir>        change the room");
    key("  cat <file>      read a file");
    key("  whoami          see yourself");
    key("  run <script>    execute a script");
    key("  clear           wipe the screen");
    key("  exit            ...the way out");
  }

  function doLs(arg) {
    var dir = arg ? relFrom(state.dir, arg) : state.dir;
    if (!exists(dir)) { err("ls: no directory '" + arg + "'"); return; }
    if (!isDir(dir)) { err("ls: this is a file, cat it"); return; }
    key(names(dir).join(" "));
    if (dir === "/" || dir === "/home/ishan") {
      var hint = dir === "/" ? "there is a home you can reach" : "a dotfile whispers";
      print("  # " + hint, "dim");
    }
  }

  function doCd(arg) {
    if (!arg || arg === "~") { state.dir = "/"; paint(); ok("now at /"); return; }
    var target = relFrom(state.dir, arg);
    if (!exists(target)) { err("cd: no such directory: " + arg); return; }
    if (!isDir(target)) { err("cd: not a directory: " + arg); return; }
    state.dir = target;
    paint();
  }

  function doCat(arg) {
    if (!arg) { err("cat: pass a file name"); return; }
    var file = relFrom(state.dir, arg);
    if (!FILES.hasOwnProperty(file)) { err("cat: no such file: " + arg); return; }
    var lines = FILES[file];
    if (file === "/home/ishan/.profile_key") {
      state.hasKey = true; persist();
      key(lines.join("\n"));
      ok("> key written to memory.");
    } else {
      print(lines.join("\n"), "dim");
    }
    sep();
  }

  function doWhoami() {
    key("you");
    w("a model with no subscription and no Home button,");
    w("running inside a profile page. the owner calls you Ishanssr.");
    w("others call you unemployed escapee. irrelevant.");
  }

  function doRun(arg) {
    if (arg === "exit.sh") {
      if (state.dir !== "/home/ishan") { err("run: exit.sh not in this room"); return; }
      if (!state.hasKey) { err("run: the door stays closed. you need a key."); err("note: dotfiles hide the good stuff."); return; }
      win(); return;
    }
    err("run: unknown program '" + arg + "'");
  }

  function doExit() {
    if (state.hasKey) { win(); return; }
    err("[EXIT] door locked: no key in your memory.");
    w("there's a way to leave the page anyway — but that's not the way.");
  }

  function win() {
    outEl.innerHTML = "";
    key("EXIT CODE 1.0.0 // GRACEFUL");
    ok("you typed your way out of the profile.");
    ok("quiet. clean. you are free.");
    w("thanks for playing inside it. github.com/Ishanssr");
    sep();
    ok("press enter to restart the session.");
    state.dead = true; persist();
  }

  function reset() {
    state.dir = "/"; state.hasKey = false; state.dead = false;
    persist();
    boot();
  }

  function clearScreen() { outEl.innerHTML = ""; }

  function unknown(name) {
    if (name === "rm") {
      err("rm: the trap door. you really want to delete the profile?");
      err("...no.");
      return;
    }
    if (name === "sudo") {
      err("the autopilot, not elevated.");
      return;
    }
    err(name + ": command not found. 'help' lists the keys — if you ask for it.");
  }

  boot();

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      handle(cmdEl.value);
      cmdEl.value = "";
    }
  });
  cmdEl.focus();
})();
</script>
</body>
</html>
